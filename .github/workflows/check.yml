name: Public source checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-and-release:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: python -X utf8 -m pip install --require-hashes -r requirements-dev.txt
      - name: Offline behavior and account isolation
        run: python -X utf8 -m pytest -q
      - name: Verify original upstreams
        run: python -X utf8 scripts/verify_upstream.py
      - name: Install pinned scanner locally
        run: python -X utf8 scripts/install_gitleaks.py
      - name: Scan source and all repository refs
        run: python -X utf8 scripts/release_check.py
